name: Build RUMIN AI Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build signed release APK
        run: gradle assembleRelease

      - name: Rename APK for download
        run: cp app/build/outputs/apk/release/app-release.apk RUMIN-AI-Release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUMIN-AI-Release-APK
          path: RUMIN-AI-Release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish directly downloadable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rumin-ai-latest
          name: RUMIN AI - Latest Release APK
          body: |
            Direct-download APK for RUMIN AI.
            This build uses the Android debug signing key for installable testing.
          prerelease: true
          make_latest: true
          overwrite_files: true
          files: RUMIN-AI-Release.apk
